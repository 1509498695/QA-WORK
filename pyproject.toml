[project]
name = "qa-skillhub-workspace"
version = "0.1.0"
description = "Virtual development workspace for QA Skill Hub components"
requires-python = ">=3.13,<3.14"
dependencies = [
    "qa-skillhub-capability-contracts",
    "workspace-feishu-auth-service",
    "workspace-feishu-mcp-server",
    "workspace-feishu-protocol",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "platform/capability-contracts",
    "providers/feishu/protocol",
    "providers/feishu/auth-service",
    "providers/feishu/mcp-server",
]
exclude = [
    "plugins/*",
    "skills/*",
]

[tool.uv.sources]
qa-skillhub-capability-contracts = { workspace = true }
workspace-feishu-auth-service = { workspace = true }
workspace-feishu-mcp-server = { workspace = true }
workspace-feishu-protocol = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
    "platform/capability-contracts/tests",
    "providers/feishu/protocol/tests",
    "providers/feishu/auth-service/tests",
    "providers/feishu/mcp-server/tests",
    "providers/feishu/tests/integration",
]
