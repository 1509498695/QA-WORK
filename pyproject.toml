[project]
name = "workspace-feishu-auth"
version = "0.4.1"
description = "Local authorization control plane and independent Feishu Provider for the shared capability workspace"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "mcp>=1.12.4,<2",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
feishu-auth = "feishu_auth_service.cli:main"
feishu-provider = "feishu_provider.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/capability_contracts",
    "src/feishu_auth_service",
    "src/feishu_provider",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
