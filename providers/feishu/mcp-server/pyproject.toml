[project]
name = "workspace-feishu-mcp-server"
version = "0.4.1"
description = "Read-only MCP server for Workspace Feishu"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.12.4,<2",
    "pydantic>=2.11,<3",
    "qa-skillhub-capability-contracts",
    "workspace-feishu-protocol",
]

[project.scripts]
feishu-provider = "feishu_provider.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feishu_provider"]

[tool.uv.sources]
qa-skillhub-capability-contracts = { workspace = true }
workspace-feishu-protocol = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
