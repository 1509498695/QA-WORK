[project]
name = "workspace-feishu-protocol"
version = "0.4.1"
description = "Private communication models shared by Workspace Feishu components"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feishu_protocol"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
