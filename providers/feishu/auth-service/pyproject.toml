[project]
name = "workspace-feishu-auth-service"
version = "0.4.1"
description = "Local authorization control plane for Workspace Feishu"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.20,<1",
    "qa-skillhub-capability-contracts",
    "uvicorn>=0.35,<1",
    "workspace-feishu-protocol",
]

[project.scripts]
feishu-auth = "feishu_auth_service.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feishu_auth_service"]

[tool.uv.sources]
qa-skillhub-capability-contracts = { workspace = true }
workspace-feishu-protocol = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
