[project]
name = "workspace-feishu-provider-runtime"
version = "0.4.1"
description = "Self-contained read-only MCP runtime for the Workspace Feishu Codex plugin"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.12.4,<2",
    "pydantic>=2.11,<3",
]

[project.scripts]
feishu-provider = "feishu_provider.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/capability_contracts",
    "src/feishu_protocol",
    "src/feishu_provider",
]
