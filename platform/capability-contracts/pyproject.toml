[project]
name = "qa-skillhub-capability-contracts"
version = "0.4.1"
description = "Provider-neutral capability contracts for QA Skill Hub"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capability_contracts"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
