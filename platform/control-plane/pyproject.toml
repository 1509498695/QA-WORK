[project]
name = "qa-skillhub-control-plane"
version = "0.2.0"
description = "Persistent identity, team, and role control plane for QA Skill Hub"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
qa-skill-hub-control-plane = "qa_skill_hub_control_plane.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_skill_hub_control_plane"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
